<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Blood Group Detection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dynamic-bg">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
    </div>
    
    <div id="noise"></div>

    <main class="container">
        <header class="header text-center fade-in">
            <h1 class="page-title"><span class="text-gradient">Fingerprint</span> Analysis</h1>
            <p class="subtitle">Next-gen neural blood group detection</p>
        </header>
        
        <div class="upload-section tilt-card glass-panel fade-in delay-1">
            <div id="drop-zone" class="drop-zone">
                <div class="border-gradient"></div>
                <input type="file" id="file-input" accept="image/*" hidden>
                
                <div id="upload-prompt" class="upload-content">
                    <div class="icon-container">
                        <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                    <p class="upload-text">Drag & Drop fingerprint here</p>
                    <button class="btn btn-outline" id="browse-btn">Browse Files</button>
                </div>
                
                <div id="file-info" class="file-info hidden">
                    <div class="file-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="file-details">
                        <span id="file-name" class="file-name">filename.png</span>
                        <span id="file-size" class="file-size">0 KB</span>
                    </div>
                    <button id="remove-file" class="action-icon">✖</button>
                </div>
            </div>
            
            <div id="preview-section" class="preview-section hidden popup-anim">
                <div class="preview-container">
                    <img id="image-preview" src="" alt="Fingerprint Preview">
                    <div id="scanner" class="scanner hidden"></div>
                </div>
                <button id="predict-btn" class="btn btn-glow mt-4">Initialize Scan</button>
            </div>
        </div>

        <div id="results-section" class="results-section hidden">
            <div class="prediction-banner tilt-card">
                <div class="banner-content">
                    <p class="banner-label">Neural Network Output</p>
                    <h2 id="prediction-text" class="banner-title text-gradient">Predicted: B-</h2>
                    
                    <div class="confidence-tracker">
                        <div class="tracker-header">
                            <span>Confidence Level</span>
                            <span id="confidence-percentage" class="text-neon-green">95.58%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="confidence-bar" class="progress-bar-fill"></div>
                        </div>
                    </div>
                </div>
                <div class="banner-glow-effect"></div>
            </div>

            <div class="charts-grid">
                <div class="chart-panel tilt-card glass-panel">
                    <h3>Distribution Analytics</h3>
                    <div class="canvas-wrapper">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-panel tilt-card glass-panel">
                    <h3>Probability Breakdown</h3>
                    <div class="canvas-wrapper">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
