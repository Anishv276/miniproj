<!DOCTYPE html>
<html>
<head>
    <title>Blood Group Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Fingerprint Blood Group Detection</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Predict</button>
    </form>

    {% if image_path %}
        <div class="preview">
            <h3>Uploaded Image:</h3>
            <img src="{{ image_path }}" width="200">
        </div>
    {% endif %}

    {% if result %}
        <div class="result">
            <h2>Predicted Blood Group: {{ result }}</h2>
            <p>Confidence: {{ "%.2f"|format(confidence) }}%</p>
        </div>
    {% endif %}
</div>

</body>
</html>
